<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Controls settings</title>
    <link rel="stylesheet" href="action.css" />
  </head>
  <body>
    <main>
      <p id="intro">
        Add one value for a direct set key. Add more values to cycle in this
        order.
      </p>
      <fieldset class="display-options">
        <legend>Key display</legend>
        <label>
          <input id="show-title" type="checkbox" />
          Show the action title
        </label>
        <label id="show-next-row">
          <input id="show-next" type="checkbox" />
          Show the next value
        </label>
        <label id="model-font-row" class="font-option">
          Model size
          <input id="model-font-size" type="number" min="10" max="48" />
        </label>
        <label id="thinking-font-row" class="font-option">
          Thinking size
          <input id="thinking-font-size" type="number" min="10" max="48" />
        </label>
        <label id="shortcut-font-row" class="font-option">
          Shortcut size
          <input id="shortcut-font-size" type="number" min="10" max="48" />
        </label>
        <label id="fade-row" class="font-option" hidden>
          Inactive fade
          <input id="inactive-fade" type="number" min="0" max="100" step="5" />
          %
        </label>
      </fieldset>
      <div id="choices" aria-live="polite"></div>
      <div class="add-row">
        <code id="current" hidden></code>
        <button id="add" type="button">Add value</button>
      </div>
      <details id="style-manager">
        <summary>Manage custom colors</summary>
        <div class="manager-fields">
          <label for="custom-style">Preset</label>
          <select id="custom-style"></select>
          <label for="style-name">Name</label>
          <input id="style-name" maxlength="32" placeholder="My colors" />
          <label for="style-border">Border</label>
          <input id="style-border" type="color" value="#38bdf8" />
          <label for="style-background">Background</label>
          <input id="style-background" type="color" value="#082f49" />
          <label for="style-font">Font</label>
          <input id="style-font" type="color" value="#f0f9ff" />
        </div>
        <div class="buttons">
          <button id="style-new" type="button">Save new</button>
          <button id="style-update" type="button">Update</button>
          <button id="style-delete" type="button">Delete</button>
        </div>
        <p id="style-error" role="alert"></p>
      </details>
    </main>
    <script src="action.js"></script>
  </body>
</html>
